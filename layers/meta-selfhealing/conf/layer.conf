# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-selfhealing"
BBFILE_PATTERN_meta-selfhealing = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-selfhealing = "10"

LAYERDEPENDS_meta-selfhealing = "core raspberrypi openembedded-layer rauc"
LAYERSERIES_COMPAT_meta-selfhealing = "scarthgap"
